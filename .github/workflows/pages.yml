name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a queued run supersedes a running one rather than
# racing it.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # The page is the scorer, not a description of it: yp-core compiles to
      # WebAssembly and runs in the visitor's browser. The files they drop on
      # the page are indexed there too, so grounding is about *their* codebase
      # and nothing they add is ever uploaded.
      - name: Build the scorer for the browser
        run: |
          cargo build -p yp-wasm --release --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/yp_wasm.wasm docs/yp.wasm

      # A page whose script does not parse is a page where nothing works at
      # all, and it looks perfectly fine to every check that only reads bytes.
      # One shipped that way -- an escape written as a literal newline left a
      # string unterminated -- so the script is now actually parsed before it
      # can be published.
      - name: Check the page
        run: |
          set -euo pipefail
          python3 - <<'PY'
          page = open('docs/index.html', encoding='utf-8').read()
          for name, ch in (('NUL', chr(0)), ('U+FFFD', chr(0xFFFD))):
              assert ch not in page, f'{name} in docs/index.html'
          script = page[page.index('<script>') + 8:page.rindex('</script>')]
          open('/tmp/page.js', 'w', encoding='utf-8').write(script)
          print(f'extracted {len(script)} bytes of script')
          PY
          node --check /tmp/page.js
          echo "docs/index.html parses"

      - name: Report what will be published
        run: ls -lh docs/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
