name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      # --all-targets skips doctests, so run them separately.
      - run: cargo test --workspace --doc

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  pages-script:
    name: the web pages parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A page whose script does not parse is a page where nothing works at
      # all, and it looks perfectly fine to every check that only reads bytes.
      # One shipped that way -- an escape written as a literal newline left a
      # string unterminated. Checking it needs a real JavaScript parser, so it
      # happens here, where there is one.
      - name: Parse the script in every page
        run: |
          set -euo pipefail
          for page in docs/index.html crates/yp-cli/assets/index.html; do
            python3 - "$page" <<'PY'
          import sys
          page = open(sys.argv[1], encoding='utf-8').read()
          for name, ch in (('NUL', chr(0)), ('U+FFFD', chr(0xFFFD))):
              assert ch not in page, f'{name} in {sys.argv[1]}'
          script = page[page.index('<script>') + 8:page.rindex('</script>')]
          open('/tmp/page.js', 'w', encoding='utf-8').write(script)
          PY
            node --check /tmp/page.js
            echo "$page parses"
          done

  zero-context:
    name: hook writes nothing to stdout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The one absolute requirement of this project: the UserPromptSubmit
      # hook must emit zero bytes on stdout, because Claude Code injects that
      # stdout straight into the model's context. Guarded here so it can never
      # regress silently. Skipped until `yp hook` exists (M2).
      - name: Check hook stdout is empty
        run: |
          if cargo run --quiet --bin yp -- hook --help >/dev/null 2>&1; then
            out=$(printf '%s' '{"prompt":"fix it","session_id":"ci","cwd":"."}' \
              | cargo run --quiet --bin yp -- hook | wc -c)
            test "$out" -eq 0 || { echo "hook wrote $out bytes to stdout"; exit 1; }
          else
            echo "yp hook not implemented yet (M2); skipping"
          fi
