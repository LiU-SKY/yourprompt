# Korean cue lexicon for yourprompt.
#
# Same six cue categories as the English file. Terms are stems; a trailing
# particle or verb ending is tolerated by the matcher (see KO_FOLLOW).
#
# Note on scope constraints: the bare particle "만" is deliberately absent.
# It is a single syllable that appears inside "하지만", "만들어", "만약" and
# a hundred other words, so it is only listed in longer, unambiguous forms
# such as "에서만" and "안에서만".

lang = "ko"

[[cue]]
id = "action_verb"
terms = [
  "추가해", "추가하", "구현해", "구현하", "만들어", "작성해", "작성하",
  "수정해", "수정하", "고쳐", "고치", "삭제해", "삭제하", "제거해", "지워",
  "바꿔", "변경해", "변경하", "이동해", "옮겨", "리팩터링", "리팩토링",
  "분리해", "합쳐", "이름 바꿔", "등록해", "노출해", "문서화",
  "테스트 작성", "마이그레이션", "포팅", "변환해", "검증해",
  "되돌려", "롤백", "업그레이드", "버전 올려", "포맷", "배포해", "생성해",
  "추출해", "인라인", "래핑", "감싸",
]

[[cue]]
id = "io_spec"
terms = [
  "반환", "리턴", "반환값", "리턴값", "입력", "출력", "인자", "파라미터",
  "매개변수", "시그니처", "타입은", "타입으로", "형태로", "형식으로",
  "결과는", "결과로", "응답", "요청", "스키마", "엔드포인트", "라우트",
  "상태 코드", "종료 코드", "표준 출력", "받아서", "돌려줘", "내보내",
]

[[cue]]
id = "acceptance"
terms = [
  "테스트", "통과하면", "통과해야", "테스트 통과", "검증", "단언",
  "기대값", "예상 결과", "예상값", "성공하면", "실패하면", "커버리지",
  "회귀", "재현", "재현 절차", "확인되면", "만족해야", "보장",
]

[[cue]]
id = "scope_constraint"
terms = [
  "건드리지 마", "건드리지 말", "손대지 마", "수정하지 마", "바꾸지 마",
  "추가하지 마", "지우지 마", "빼고", "없이", "제외", "제외하고",
  "유지해", "유지하", "그대로", "그대로 둬", "안에서만", "에서만",
  "하위 호환", "범위는", "이외에는", "말고", "다른 건", "나머지는",
]

[[cue]]
id = "example_marker"
terms = [
  "예를 들어", "예를 들면", "예시", "예시:", "이런 식으로", "아래처럼",
  "아래와 같이", "다음과 같이", "다음처럼", "샘플", "입력:", "출력:",
  "기대:", "현재:", "변경 전", "변경 후",
]

[[cue]]
id = "conjunction"
terms = [
  "그리고", "또한", "추가로", "그다음", "그 다음", "아울러", "덤으로",
  "하는 김에", "온 김에", "그리고 또", "하나 더", "참고로 또",
]
