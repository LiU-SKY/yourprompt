# English cue lexicon for yourprompt.
#
# Cues are the mirror image of smells: terms whose *presence* is evidence that
# a prompt is executable. The B (actionability) and D (context sufficiency)
# axes are built from these.
#
# Deliberate omissions:
#   - Polysemous verbs ("handle", "check", "sort out") are NOT action verbs.
#     They name an action without naming what the action is, so rewarding them
#     would cancel out the penalty they earn as a smell. The exceptions are
#     the few that cues.ko.toml also counts ("look into" for 봐줘), listed at
#     the end of the action verbs: a vague request must still outscore text
#     that asks for nothing.
#   - Femmer's "negative statements" smell is not ported. In a requirements
#     document a negative requirement is hard to verify; in a prompt to a
#     coding agent, "don't touch the migrations" is one of the most useful
#     things a user can say. Negation is therefore scored as a scope
#     constraint here, and never penalised. The verb under it is part of the
#     constraint, not the objective: "change" in "don't change the schema"
#     names the one thing not to do, and yp-core reads it that way.
#   - "use", "open", "save" and "try" are not action verbs. "use" names how
#     to do the work more often than more work: added, it changed 52 of the
#     benchmark, corpus and honest-set prompts, and lowered 31 of them as an
#     objective beside the one they had ("Fix the race ... Use SELECT ... FOR
#     UPDATE"). "open" and "save" are mostly the steps of a reproduction
#     ("Open settings.py", "Clicking Save twice"): 9 of the 10 prompts they
#     changed went down. "try" asks for what follows it: "Try to fix the
#     flaky test" asks for one thing.

lang = "en"

[[cue]]
id = "action_verb"
terms = [
  "add", "create", "implement", "write", "build", "generate", "scaffold",
  "fix", "repair", "debug", "patch", "resolve", "correct",
  "change", "update", "modify", "adjust", "rewrite", "extend",
  "refactor", "rename", "move", "extract", "inline", "split", "merge",
  "delete", "remove", "drop", "replace", "swap", "revert", "roll back",
  "upgrade", "migrate", "port", "convert", "bump", "pin",
  "wire up", "register", "expose", "document", "annotate", "comment",
  "test", "cover", "benchmark", "profile", "instrument", "log",
  "validate", "sanitize", "cache", "parse", "serialize", "deserialize",
  "lint", "format", "deploy", "publish", "release", "mock", "stub",
  "enable", "disable", "throw", "emit", "print", "guard", "encode",
  "decode", "normalize", "retry", "compile", "bundle", "sync", "restore",
  "downgrade", "hook up", "silence", "suppress", "dedupe", "backfill",
  # Parity with cues.ko.toml, which counts 만들어, 최적화, 설명해, 봐줘 and
  # 정리해: "make it better" scored 90 against 239 for "좀 더 좋게
  # 만들어줘". A vague request is still a request; the vagueness is charged
  # as a smell, in both languages.
  "make", "optimize", "optimise", "speed up", "explain", "investigate",
  "diagnose", "find", "look at", "look into", "clean up",
  # "run the tests" scored 65 with no objective at all. "run" is also a
  # noun, and "the CI run failed, fix it" pays for it as a second objective
  # (328 -> 312): the same trade "build", "test" and "release" already make.
  "run", "rerun", "re-run", "execute",
  # Parity with 커밋해, 푸시해 and 설치해: "commit the changes" scored 65
  # with no objective. After a determiner they are nouns, as "build" and
  # "test" are: "this commit", "a push notification".
  "commit", "push", "install",
  # Parity with 리뷰해. "review" stays a polysemous verb as well, the way
  # "look into" does, so "review the PR" asks for something and still pays
  # for not saying what to look for; cues.ko.toml's 리뷰해 pays the same.
  "review",
  # Parity with 종료해 and 죽여, 재계산해, 체리픽해, 스쿼시해, 알려줘 and 설정해,
  # and with 빌드해 after 다시. Once "port" in "Kill the process on port
  # 3000." was read as the noun it is, nothing was left to do in it, and it
  # scored 132.4.
  "kill", "rebuild", "recompute", "cherry-pick", "squash", "notify",
  "paginate", "set up",
  # Parity with 시작해, 중지해, 재시작해, 새로고침해, 초기화해, 비워, 건너뛰어,
  # 켜줘, 꺼줘, 제한해 and 트리거해; "show" has no twin there (see
  # cues.ko.toml). Software does these as often as it is asked to: "two
  # workers start at once", "delete() doesn't clear PKs". yp-core counts them
  # only where an instruction starts; see its nouns.
  "start", "stop", "restart", "reload", "refresh", "reset", "clear", "show",
  "trigger", "turn on", "turn off", "skip", "cap",
  # "skip it" is also a reply on its own (followups.en.toml); held whole, the
  # verb is never part of a longer reply.
  "skip it",
]

[[cue]]
id = "io_spec"
terms = [
  "returns", "should return", "must return", "return type", "return value",
  "return types", "return values",
  "signature", "input", "inputs", "output", "outputs", "parameter",
  "parameters", "argument", "arguments", "takes", "accepts", "expects",
  "response", "request body", "payload", "schema", "endpoint", "route",
  "status code", "exit code", "stdout", "stderr", "json", "yaml",
  "given", "when", "then", "for input", "produces", "yields",
  "the shape", "type is", "typed as", "->", "=>",
]

[[cue]]
id = "acceptance"
terms = [
  "test passes", "tests pass", "should pass", "unit test", "integration test",
  "assert", "asserts", "assertion", "verify", "verified", "verifiable",
  "acceptance", "definition of done", "expected", "expect", "expects to",
  "so that", "must equal", "should equal", "no regression", "regression test",
  "green", "ci passes", "coverage", "reproduce", "repro", "steps to reproduce",
  "must pass", "has to pass", "still pass", "still passes", "keeps passing",
  "make sure", "ensure", "confirm", "succeeds", "fails with", "done when",
  "criteria", "must hold", "should hold",
  # Saying what done means is the most repeated advice there is, and
  # "Done means: the test suite passes" earned none of the acceptance points
  # that "The existing tests must still pass" did.
  "done means", "done is when", "done looks like", "finished when",
  "complete when", "test suite passes", "test suite pass", "suite passes",
  "suite pass", "tests passing", "pass all tests", "passes all tests",
  "pass the tests", "passes the tests", "build passes", "lint passes",
  "without warnings", "no warnings", "no new warnings", "zero warnings",
  "without errors",
]

[[cue]]
id = "scope_constraint"
terms = [
  "only", "only in", "only touch", "do not", "don't", "never", "without",
  "must not", "should not", "avoid", "except", "excluding", "besides that",
  "limit to", "limited to", "restrict", "restricted to", "confine",
  "keep", "leave", "unchanged", "untouched", "as-is", "in place",
  "backwards compatible", "backward compatible", "no new dependencies",
  "no new deps", "out of scope", "in scope", "scoped to", "nothing else",
  # The same prohibitions as typed in a hurry or on a phone, which turns the
  # apostrophe into U+2019.
  "dont", "don’t", "mustn't", "mustn’t", "shouldn't", "shouldn’t",
]

[[cue]]
id = "example_marker"
terms = [
  "for example", "for instance", "e.g.", "example:", "examples:", "sample",
  "like this:", "as follows", "here is", "here's", "case 1", "case 2",
  "before:", "after:", "input:", "output:", "expected:", "actual:",
]

[[cue]]
id = "conjunction"
terms = [
  "and also", "also", "additionally", "in addition", "plus", "as well as",
  "and then", "after that", "furthermore", "moreover", "besides",
  "while you're at it", "on top of that", "one more thing", "oh and",
]
