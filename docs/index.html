<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yourprompt</title>
<meta name="description" content="Scores how well an AI coding agent can understand your prompt, against your actual repository. Runs entirely in your browser.">
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --ink: #1a1a18; --dim: #6b6b66;
    --line: #e4e4e0; --accent: #2f6f4f; --warn: #8a6d1f; --bad: #9b3a2f;
    --track: #ecece8; --drop: rgba(47,111,79,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #1d1e22; --ink: #e8e8e4; --dim: #96968f;
      --line: #2c2d32; --accent: #6fbf90; --warn: #d6b45c; --bad: #e08a7c;
      --track: #26272c; --drop: rgba(111,191,144,.10);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          "Noto Sans KR", Roboto, sans-serif;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 34px 20px 72px; }
  header { margin-bottom: 22px; }
  .top { display: flex; align-items: baseline; gap: 12px; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.015em; }
  .langs { margin-left: auto; display: flex; gap: 0; border: 1px solid var(--line);
           border-radius: 7px; overflow: hidden; }
  .langs button { border: 0; border-radius: 0; padding: 4px 10px; font-size: 12.5px;
                  color: var(--dim); }
  .langs button.on { background: var(--track); color: var(--ink); font-weight: 600; }
  .sub { color: var(--dim); font-size: 13.5px; margin: 0; }
  .sub code { font-size: 12.5px; }
  .lede { margin: 10px 0 0; max-width: 62ch; color: var(--dim); font-size: 13.5px; }
  @media (prefers-reduced-motion: reduce) {
    .fill { transition: none; }
  }

  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: 10px; padding: 16px; }
  .label { font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
           color: var(--dim); margin: 0 0 6px; }
  .label .hint { text-transform: none; letter-spacing: 0; }
  .tools { display: flex; gap: 8px; align-items: center; margin: 12px 0 6px;
           flex-wrap: wrap; }
  button {
    font: inherit; font-size: 13.5px; padding: 6px 12px; border-radius: 7px;
    border: 1px solid var(--line); background: transparent; color: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .note { font-size: 12.5px; color: var(--dim); margin-left: auto; }
  .note.bad { color: var(--bad); }

  textarea {
    width: 100%; min-height: 128px; resize: vertical; padding: 12px;
    background: transparent; color: inherit; border: 1px solid var(--line);
    border-radius: 8px; font: 14px/1.6 ui-monospace, SFMono-Regular,
    "Cascadia Mono", Menlo, Consolas, monospace;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .dropping { border-color: var(--accent) !important; background: var(--drop); }

  .attachments { margin-top: 10px; display: grid; gap: 6px; }
  .att {
    display: flex; align-items: center; gap: 10px; font-size: 13px;
    border: 1px dashed var(--line); border-radius: 7px; padding: 7px 10px;
  }
  .att .nm { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .att .sz { color: var(--dim); }
  .att button { margin-left: auto; padding: 2px 8px; font-size: 12px; }
  .empty-att { color: var(--dim); font-size: 12.5px; font-style: italic;
               border: 1px dashed var(--line); border-radius: 7px; padding: 9px 10px; }

  .bar-row { display: flex; align-items: baseline; gap: 14px; margin: 22px 0 6px; }
  .total { font-size: 42px; font-weight: 650; letter-spacing: -0.02em;
           font-variant-numeric: tabular-nums; }
  .grade { font-size: 21px; font-weight: 600; }
  .of { color: var(--dim); font-size: 13px; }
  .flag { color: var(--dim); font-size: 12.5px; margin-left: auto; }
  .track { height: 8px; background: var(--track); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; transition: width .18s ease; }

  .axes { margin-top: 26px; display: grid; gap: 14px; }
  .axis { border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px;
          background: var(--panel); }
  .axis > .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 9px; }
  .axis .name { font-weight: 600; text-transform: capitalize; }
  .axis .num { margin-left: auto; color: var(--dim); font-size: 13px;
               font-variant-numeric: tabular-nums; }
  .comp { display: grid; grid-template-columns: 128px 74px 1fr; gap: 10px;
          align-items: baseline; padding: 4px 0; font-size: 13.5px; }
  .comp .cn { color: var(--dim); }
  .comp .cv { font-variant-numeric: tabular-nums; }
  .comp .cd { color: var(--dim); overflow-wrap: anywhere; }
  .muted { color: var(--dim); font-style: italic; }
  footer { margin-top: 34px; color: var(--dim); font-size: 12.5px; line-height: 1.7; }
  a { color: var(--accent); }
  .err { color: var(--bad); }
  @media (max-width: 640px) {
    .comp { grid-template-columns: 1fr; gap: 2px; }
    .comp .cd { margin-bottom: 6px; }
    .note { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1>yourprompt</h1>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" id="lang-en">EN</button>
        <button type="button" id="lang-ko">한국어</button>
      </div>
    </div>
    <p class="lede" id="lede"></p>
    <p class="sub" id="sub" style="margin-top:6px">Loading the scorer…</p>
  </header>

  <div class="panel">
    <p class="label" id="label-prompt">Prompt</p>
    <textarea id="p" spellcheck="false" autofocus></textarea>

    <p class="label" style="margin-top:16px" id="label-code"></p>
    <div class="attachments" id="atts"></div>

    <div class="tools">
      <button type="button" id="open"></button>
      <button type="button" id="download" disabled></button>
      <button type="button" id="clear"></button>
      <input type="file" id="file" hidden multiple accept=".txt,.md,.markdown,.rst,.text,text/*">
      <span class="note" id="note"></span>
    </div>

    <div class="bar-row">
      <span class="total" id="total">--</span>
      <span class="of">/ 1000</span>
      <span class="grade" id="grade"></span>
      <span class="flag" id="flag"></span>
    </div>
    <div class="track"><div class="fill" id="fill" style="width:0"></div></div>
  </div>

  <div class="axes" id="axes"></div>

  <footer id="foot"></footer>
</div>

<script>
const $ = id => document.getElementById(id);
const colourFor = r => r >= 0.70 ? 'var(--accent)' : r >= 0.50 ? 'var(--warn)' : 'var(--bad)';
const MAX_BYTES = 256 * 1024;
const enc = new TextEncoder(), dec = new TextDecoder();

let wasm = null, indexBytes = null, lastScore = null;
let files = [];         // { name, text } -- the visitor's codebase

// --- language ---------------------------------------------------------------
// Everything the page says exists in both languages; the per-component
// reasoning sentences come from the scoring engine and stay in English.

const STR = {
  en: {
    lede: 'Scores how well an AI coding agent can understand your prompt, with a reason for every point.',
    placeholder: 'What do you want the agent to do?\n\ne.g. In src/auth/login.rs, change verify_token so it returns Err(AuthError::Expired) instead of panicking on an expired token. Don\'t change the public signature of login(). tests/auth.rs must still pass.',
    label_prompt: 'Prompt',
    label_code: 'Your codebase <span class="hint">· drop source files to ground the score in them</span>',
    open: 'Add source files…',
    download: 'Download report',
    clear: 'Clear',
    remove: 'remove',
    empty: 'No files yet, so grounding is not scored. Drop source files here: whether the things you name exist, and whether they point at one thing or forty.',
    footer: 'The whole scorer is compiled to WebAssembly and runs here; there is no server and no model call. The files you add are indexed in your browser and never leave it. For a whole repository rather than a handful of files, run <code>yp serve --repo .</code> locally.<br><a href="https://github.com/LiU-SKY/yourprompt">source and benchmarks</a>',
    loading: 'Loading the scorer…',
    ready: v => `v${v} · runs in your browser · nothing uploaded · deterministic`,
    load_failed: 'could not load the scorer: ',
    not_scored: 'not scored',
    no_index: 'No repository index loaded, so the remaining axes were rescaled to 1000.',
    rescaled: 'ungrounded, rescaled',
    unreadable: 'the scorer could not read that',
    too_big: (n, kb) => `${n} is ${kb} KB, over the 256 KB limit`,
    read_failed: n => `could not read ${n}`,
    not_text: n => `${n} does not look like text`,
    added: n => `added ${n}`,
    saved: n => `saved ${n}`,
    axes: { grounding: 'grounding', actionability: 'actionability',
            clarity: 'clarity', context: 'context' },
    comps: { resolution: 'resolution', specificity: 'specificity', deixis: 'deixis',
             objective: 'objective', singularity: 'singularity', io_spec: 'io_spec',
             acceptance: 'acceptance', smell_density: 'smell_density',
             scope: 'scope', evidence: 'evidence', shape: 'shape' },
    rpt: { generated: 'Generated', grounded: 'Grounded', yes: 'yes',
           no: 'no (score rescaled from three axes)', prompt: 'Prompt',
           codebase: 'Codebase indexed', breakdown: 'Breakdown', none: '- none',
           head: '| component | score | out of | why |',
           no_index: 'No repository index was loaded.',
           foot: 'Scored by [yourprompt](https://github.com/LiU-SKY/yourprompt), in the browser. Deterministic; no model was called.' },
  },
  ko: {
    lede: 'AI 코딩 에이전트가 프롬프트를 얼마나 이해할 수 있는지, 모든 점수의 사유와 함께 채점합니다.',
    placeholder: '에이전트가 무엇을 하길 원하나요?\n\n예: src/auth/login.rs 의 verify_token 이 만료된 토큰에서 panic 하는 대신 Err(AuthError::Expired) 를 반환하도록 수정해줘. login() 의 공개 시그니처는 바꾸지 말 것. tests/auth.rs 는 계속 통과해야 함.',
    label_prompt: '프롬프트',
    label_code: '코드베이스 <span class="hint">· 소스 파일을 끌어다 놓으면 그 파일들을 근거로 채점합니다</span>',
    open: '소스 파일 추가…',
    download: '리포트 다운로드',
    clear: '지우기',
    remove: '제거',
    empty: '아직 파일이 없어 그라운딩 축은 채점되지 않습니다. 소스 파일을 끌어다 놓으면 당신의 코드베이스 기준으로 채점합니다.',
    footer: '채점기 전체가 WebAssembly 로 컴파일되어 여기서 실행됩니다. 서버도, 모델 호출도 없습니다. 추가한 파일은 브라우저 안에서 인덱싱되며 밖으로 나가지 않습니다. 파일 몇 개가 아니라 저장소 전체로 채점하려면 로컬에서 <code>yp serve --repo .</code> 를 실행하세요.<br><a href="https://github.com/LiU-SKY/yourprompt">소스와 벤치마크</a>',
    loading: '채점기를 불러오는 중…',
    ready: v => `v${v} · 브라우저에서 실행 · 업로드 없음 · 결정론적`,
    load_failed: '채점기를 불러오지 못했습니다: ',
    not_scored: '채점 안 함',
    no_index: '저장소 인덱스가 없어 나머지 축을 1000점으로 재조정했습니다.',
    rescaled: '비접지, 재조정됨',
    unreadable: '채점기가 입력을 읽지 못했습니다',
    too_big: (n, kb) => `${n} 은(는) ${kb} KB 로 최대 256 KB 를 넘습니다`,
    read_failed: n => `${n} 을(를) 읽지 못했습니다`,
    not_text: n => `${n} 은(는) 텍스트 파일이 아닌 것 같습니다`,
    added: n => `${n} 추가됨`,
    saved: n => `${n} 저장됨`,
    axes: { grounding: '그라운딩', actionability: '실행가능성',
            clarity: '명료성', context: '맥락' },
    comps: { resolution: '지시대상 해소', specificity: '특정성', deixis: '지시어',
             objective: '목적', singularity: '단일성', io_spec: '입출력 사양',
             acceptance: '완료 기준', smell_density: '모호성 밀도',
             scope: '범위 제한', evidence: '예시·근거', shape: '형태' },
    rpt: { generated: '생성 시각', grounded: '그라운딩', yes: '예',
           no: '아니오 (세 축에서 재조정된 점수)', prompt: '프롬프트',
           codebase: '인덱싱된 코드베이스', breakdown: '세부 내역', none: '- 없음',
           head: '| 항목 | 점수 | 만점 | 사유 |',
           no_index: '저장소 인덱스가 없었습니다.',
           foot: '[yourprompt](https://github.com/LiU-SKY/yourprompt) 가 브라우저에서 채점했습니다. 결정론적이며 모델 호출은 없습니다.' },
  },
};

let lang = 'en';
try {
  lang = localStorage.getItem('yp-lang')
    || ((navigator.language || '').toLowerCase().startsWith('ko') ? 'ko' : 'en');
} catch (e) { /* storage may be unavailable; English is fine */ }
if (!STR[lang]) lang = 'en';

const T = () => STR[lang];
const axisName = id => T().axes[id] || id;
const compName = id => T().comps[id] || id;

function applyLang() {
  document.documentElement.lang = lang;
  $('lang-en').className = lang === 'en' ? 'on' : '';
  $('lang-ko').className = lang === 'ko' ? 'on' : '';
  $('lede').innerHTML = T().lede;
  $('p').placeholder = T().placeholder;
  $('label-prompt').textContent = T().label_prompt;
  $('label-code').innerHTML = T().label_code;
  $('open').textContent = T().open;
  $('download').textContent = T().download;
  $('clear').textContent = T().clear;
  $('foot').innerHTML = T().footer;
  if (wasm) {
    $('sub').textContent = T().ready(wasmVersion);
  } else {
    $('sub').textContent = T().loading;
  }
  note('');
  renderFiles();
  if (lastScore) render(lastScore);
}

function setLang(next) {
  lang = next;
  try { localStorage.setItem('yp-lang', next); } catch (e) { /* fine */ }
  applyLang();
}
$('lang-en').addEventListener('click', () => setLang('en'));
$('lang-ko').addEventListener('click', () => setLang('ko'));

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function note(message, bad) {
  $('note').textContent = message || '';
  $('note').className = 'note' + (bad ? ' bad' : '');
}

// --- the WebAssembly boundary ---------------------------------------------
// Strings cross as (pointer, length) and come back length-prefixed. Every
// buffer we take ownership of is handed straight back.

function write(bytes) {
  if (!bytes.length) return [0, 0];
  const ptr = wasm.yp_alloc(bytes.length);
  new Uint8Array(wasm.memory.buffer, ptr, bytes.length).set(bytes);
  return [ptr, bytes.length];
}

function readAndFree(ptr) {
  if (!ptr) return null;
  const view = new DataView(wasm.memory.buffer);
  const len = view.getUint32(ptr, true);
  const text = dec.decode(new Uint8Array(wasm.memory.buffer, ptr + 4, len));
  wasm.yp_free(ptr, 4 + len);
  return text;
}

function scoreNow(instruction) {
  const buffers = [];
  try {
    const [tp, tl] = write(enc.encode(instruction)); buffers.push([tp, tl]);
    const [ap, al] = write(new Uint8Array());        buffers.push([ap, al]);
    const [ip, il] = write(indexBytes || new Uint8Array()); buffers.push([ip, il]);
    const out = wasm.yp_score_parts(tp, tl, ap, al, ip, il);
    const json = readAndFree(out);
    return json ? JSON.parse(json) : null;
  } finally {
    for (const [ptr, len] of buffers) if (ptr) wasm.yp_free(ptr, len);
  }
}

/// Index the visitor's files, in their browser. The files *are* the
/// repository, so the grounding axis is about their code and not about
/// whichever project happened to ship with the page.
function rebuildIndex() {
  if (!files.length) { indexBytes = null; return; }
  const payload = files.map(f => f.name + '\u001f' + f.text).join('\u001e');
  const bytes = enc.encode(payload);
  const [p, l] = write(bytes);
  try {
    const out = wasm.yp_index_build(p, l);
    if (!out) { indexBytes = null; return; }
    const view = new DataView(wasm.memory.buffer);
    const len = view.getUint32(out, true);
    indexBytes = new Uint8Array(
      new Uint8Array(wasm.memory.buffer, out + 4, len));  // copy before freeing
    wasm.yp_free(out, 4 + len);
  } finally {
    if (p) wasm.yp_free(p, l);
  }
}

// --- rendering -------------------------------------------------------------

function renderAxis(axis, absent) {
  if (absent) {
    return `<div class="axis"><div class="head"><span class="name">${axisName('grounding')}</span>
      <span class="num">${T().not_scored}</span></div>
      <div class="muted">${T().no_index}</div></div>`;
  }
  const r = axis.max ? axis.earned / axis.max : 0;
  const comps = axis.components.map(c => `
    <div class="comp">
      <span class="cn">${compName(c.id)}</span>
      <span class="cv">${c.earned.toFixed(1)} / ${c.max.toFixed(0)}</span>
      <span class="cd">${escapeHtml(c.detail)}</span>
    </div>`).join('');
  return `<div class="axis">
    <div class="head">
      <span class="name">${axisName(axis.id)}</span>
      <span class="num">${axis.earned.toFixed(1)} / ${axis.max.toFixed(0)}</span>
    </div>
    <div class="track" style="margin-bottom:8px">
      <div class="fill" style="width:${(r*100).toFixed(1)}%;background:${colourFor(r)}"></div>
    </div>
    ${comps}</div>`;
}

function render(s) {
  const r = s.total / 1000;
  $('total').textContent = s.total.toFixed(1);
  $('grade').textContent = s.grade;
  $('grade').style.color = colourFor(r);
  $('fill').style.width = (r * 100).toFixed(1) + '%';
  $('fill').style.background = colourFor(r);
  $('flag').textContent = s.renormalized ? T().rescaled : '';
  $('axes').innerHTML =
    renderAxis(s.grounding, !s.grounding) +
    renderAxis(s.actionability) + renderAxis(s.clarity) + renderAxis(s.context);
}

function clearScore() {
  lastScore = null;
  $('download').disabled = true;
  $('total').textContent = '--'; $('grade').textContent = '';
  $('fill').style.width = '0'; $('flag').textContent = '';
  $('axes').innerHTML = '';
}

function renderFiles() {
  if (!files.length) {
    $('atts').innerHTML = '<div class="empty-att">' + T().empty + '</div>';
    return;
  }
  $('atts').innerHTML = files.map((a, i) => `
    <div class="att">
      <span class="nm">${escapeHtml(a.name)}</span>
      <span class="sz">${(a.text.length / 1024).toFixed(1)} KB</span>
      <button type="button" data-i="${i}">${T().remove}</button>
    </div>`).join('');
  $('atts').querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => {
      files.splice(Number(b.dataset.i), 1);
      renderFiles();
      rebuildIndex();
      score();
    }));
}

// --- scoring ---------------------------------------------------------------

let timer = null;
function score() {
  if (!wasm) return;
  const text = $('p').value;
  if (!text.trim()) { clearScore(); return; }
  try {
    const s = scoreNow(text);
    if (!s) throw new Error(T().unreadable);
    lastScore = s;
    $('download').disabled = false;
    render(s);
  } catch (e) {
    clearScore();
    $('axes').innerHTML = '<div class="axis err">' + escapeHtml(e.message) + '</div>';
  }
}

$('p').addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(score, 120);
});

// --- attaching files -------------------------------------------------------

function looksBinary(text) {
  // A NUL byte never appears in text a human wrote.
  if (text.indexOf('\u0000') !== -1) return true;
  // Repeated U+FFFD means the bytes were decoded as UTF-8 but were not.
  const replacements = (text.match(/\uFFFD/g) || []).length;
  return replacements > 3 && replacements / Math.max(text.length, 1) > 0.001;
}

function addFile(file) {
  if (!file) return;
  if (file.size > MAX_BYTES) {
    note(T().too_big(file.name, (file.size / 1024).toFixed(0)), true);
    return;
  }
  const reader = new FileReader();
  reader.onerror = () => note(T().read_failed(file.name), true);
  reader.onload = () => {
    const text = String(reader.result);
    if (looksBinary(text)) { note(T().not_text(file.name), true); return; }
    files.push({ name: file.name, text });
    note(T().added(file.name));
    renderFiles();
    rebuildIndex();
    score();
  };
  reader.readAsText(file, 'utf-8');
}

$('open').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => {
  for (const f of e.target.files) addFile(f);
  e.target.value = '';
});

for (const target of [$('p'), $('atts')]) {
  ['dragenter', 'dragover'].forEach(k =>
    target.addEventListener(k, e => { e.preventDefault(); target.classList.add('dropping'); }));
  ['dragleave', 'drop'].forEach(k =>
    target.addEventListener(k, () => target.classList.remove('dropping')));
  target.addEventListener('drop', e => {
    e.preventDefault();
    for (const f of (e.dataTransfer.files || [])) addFile(f);
  });
}

$('clear').addEventListener('click', () => {
  $('p').value = ''; files = []; note('');
  renderFiles(); rebuildIndex(); clearScore(); $('p').focus();
});

// --- the report ------------------------------------------------------------

function axisSection(axis, id) {
  if (!axis) {
    return `### ${axisName('grounding')}: ${T().not_scored}\n\n${T().rpt.no_index}\n`;
  }
  const rows = axis.components.map(c =>
    `| ${compName(c.id)} | ${c.earned.toFixed(1)} | ${c.max.toFixed(0)} | ${c.detail.replace(/\|/g, '\\|')} |`
  ).join('\n');
  return `### ${axisName(id)}: ${axis.earned.toFixed(1)} / ${axis.max.toFixed(0)}\n\n` +
    `${T().rpt.head}\n|---|---:|---:|---|\n${rows}\n`;
}

function buildReport(s, prompt) {
  const longest = (prompt.match(/`+/g) || []).reduce((n, run) => Math.max(n, run.length), 0);
  const fence = '`'.repeat(Math.max(3, longest + 1));
  const listed = files.length
    ? files.map(a => `- ${a.name} (${(a.text.length / 1024).toFixed(1)} KB)`).join('\n')
    : T().rpt.none;
  return [
    `# yourprompt`, ``,
    `**${s.total.toFixed(1)} / 1000 (${s.grade})**`, ``,
    `| | |`, `|---|---|`,
    `| ${T().rpt.generated} | ${new Date().toISOString()} |`,
    `| ${T().rpt.grounded} | ${s.renormalized ? T().rpt.no : T().rpt.yes} |`,
    ``, `## ${T().rpt.prompt}`, ``, fence, prompt, fence,
    ``, `## ${T().rpt.codebase}`, ``, listed,
    ``, `## ${T().rpt.breakdown}`, ``,
    axisSection(s.grounding, 'grounding'),
    axisSection(s.actionability, 'actionability'),
    axisSection(s.clarity, 'clarity'),
    axisSection(s.context, 'context'),
    `---`, ``,
    T().rpt.foot, ``,
  ].join('\n');
}

$('download').addEventListener('click', () => {
  if (!lastScore) return;
  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 16);
  const name = `yourprompt-${lastScore.total.toFixed(0)}-${stamp}.md`;
  const blob = new Blob([buildReport(lastScore, $('p').value)],
                        {type: 'text/markdown;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = name;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  note(T().saved(name));
});

// --- boot ------------------------------------------------------------------

let wasmVersion = '';
applyLang();
(async () => {
  try {
    const { instance } = await WebAssembly.instantiateStreaming(fetch('yp.wasm'), {});
    wasm = instance.exports;
  } catch (e) {
    // instantiateStreaming needs the right MIME type; fall back if the host
    // serves .wasm as something else.
    try {
      const bytes = await (await fetch('yp.wasm')).arrayBuffer();
      wasm = (await WebAssembly.instantiate(bytes, {})).instance.exports;
    } catch (e2) {
      $('sub').innerHTML = '<span class="err">' + T().load_failed
        + escapeHtml(e2.message) + '</span>';
      return;
    }
  }
  wasmVersion = readAndFree(wasm.yp_version());
  $('sub').textContent = T().ready(wasmVersion);
  score();
})();
</script>
