<style>
  :root {

    --track: #ecece8; --drop: rgba(47,111,79,.08);
    --m-good: rgba(47,111,79,.20); --m-warn: rgba(214,166,50,.30);
    --m-bad: rgba(200,70,50,.22);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #1d1e22; --ink: #e8e8e4; --dim: #96968f;
      --line: #2c2d32; --accent: #6fbf90; --warn: #d6b45c; --bad: #e08a7c;
      --track: #26272c; --drop: rgba(111,191,144,.10);

  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);

  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 34px 20px 72px; }
  header { margin-bottom: 22px; }
  .top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.015em; }

  .langs button { border: 0; border-radius: 0; padding: 4px 10px; font-size: 12.5px;
                  color: var(--dim); }
  .langs button.on { background: var(--track); color: var(--ink); font-weight: 600; }
  .star { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;

  .install { margin: 8px 0 0; font-size: 13.5px; }
  .try { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px;

  .try:empty { display: none; }
  .try button { font-size: 12.5px; padding: 2px 9px; max-width: 100%;

  .sub { color: var(--dim); font-size: 13.5px; margin: 0; }
  .sub code { font-size: 12.5px; }
  .lede { margin: 10px 0 0; max-width: 62ch; color: var(--dim); font-size: 13.5px; }
  @media (prefers-reduced-motion: reduce) {
    .fill { transition: none; }
  }

  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: 10px; padding: 16px; }
  .label { font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
           color: var(--dim); margin: 0 0 6px; }
  .label .hint { text-transform: none; letter-spacing: 0; }
  .tools { display: flex; gap: 8px; align-items: center; margin: 12px 0 6px;
           flex-wrap: wrap; }
  button {
    font: inherit; font-size: 13.5px; padding: 6px 12px; border-radius: 7px;
    border: 1px solid var(--line); background: transparent; color: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .note { font-size: 12.5px; color: var(--dim); margin-left: auto; }
  .note.bad { color: var(--bad); }

  textarea {
    width: 100%; min-height: 128px; resize: vertical; padding: 12px;
    background: transparent; color: inherit; border: 1px solid var(--line);
    border-radius: 8px; font: 14px/1.6 ui-monospace, SFMono-Regular,
    "Cascadia Mono", Menlo, Consolas, monospace;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .dropping { border-color: var(--accent) !important; background: var(--drop); }

  .editor { position: relative; }
  .editor textarea { position: relative; display: block; }
  .hl {
    position: absolute; inset: 0; margin: 0; padding: 12px; overflow: hidden;
    border: 1px solid transparent; border-radius: 8px;
    font: 14px/1.6 ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo,
    Consolas, monospace; white-space: pre-wrap; overflow-wrap: break-word;
    color: transparent; pointer-events: none;
  }
  .hl mark { color: transparent; border-radius: 3px; background: var(--m-good); }
  .hl mark.warn { background: var(--m-warn); }
  .hl mark.bad { background: var(--m-bad); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px;
            color: var(--dim); margin: 8px 0 0; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
              vertical-align: -1px; margin-right: 5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 12.5px; padding: 2px 8px; border-radius: 6px;

  .chip b { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo,
            Consolas, monospace; font-weight: 500; }
  .chip.good { background: var(--m-good); }
  .chip.warn { background: var(--m-warn); }
  .chip.bad { background: var(--m-bad); }

  .attachments { margin-top: 10px; display: grid; gap: 6px; }
  .att {
    display: flex; align-items: center; gap: 10px; font-size: 13px;
    border: 1px dashed var(--line); border-radius: 7px; padding: 7px 10px;
  }
  .att .nm { font-family: ui-monospace, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
  .att .sz { color: var(--dim); white-space: nowrap; }
  .att button { margin-left: auto; padding: 2px 8px; font-size: 12px; }
  .att.sample { flex-wrap: wrap; row-gap: 4px; }
  .att.sample .nm { order: 1; flex-basis: 100%; color: var(--dim); font-size: 12.5px; }
  .empty-att { color: var(--dim); font-size: 12.5px; font-style: italic;
               border: 1px dashed var(--line); border-radius: 7px; padding: 9px 10px; }
  .empty-att button, .why button { font-size: 12.5px; padding: 2px 9px; font-style: normal; }
  .offered-below .empty-att button { display: none; }

  .bar-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px;
             margin: 22px 0 6px; }
  .total { font-size: 42px; font-weight: 650; letter-spacing: -0.02em;
           font-variant-numeric: tabular-nums; }
  .grade { font-size: 21px; font-weight: 600; }
  .of { color: var(--dim); font-size: 13px; }
  .badge { font-size: 12.5px; padding: 2px 9px; border-radius: 999px; white-space: nowrap;
           color: var(--ink); }
  .badge.warn { background: var(--m-warn); }
  .badge.good { background: var(--m-good); }
  .why { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px;
         margin: 10px 0 0; font-size: 13px; color: var(--dim); }
  .why.ungraded { color: var(--ink); font-size: 14px; }
  .track { height: 8px; background: var(--track); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; transition: width .18s ease; }

  .axes { margin-top: 26px; display: grid; gap: 14px; }
  .axis { border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px;
          background: var(--panel); }
  .axis > .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 9px; }
  .axis .name { font-weight: 600; text-transform: capitalize; }
  .axis .num { margin-left: auto; color: var(--dim); font-size: 13px;
               font-variant-numeric: tabular-nums; }
  .comp { display: grid; grid-template-columns: 128px 74px 1fr; gap: 10px;
          align-items: baseline; padding: 4px 0; font-size: 13.5px; }
  .comp .cn { color: var(--dim); }
  .comp .cv { font-variant-numeric: tabular-nums; }
  .comp .cd { color: var(--dim); overflow-wrap: anywhere; }
  .muted { color: var(--dim); font-style: italic; }
  footer { margin-top: 34px; color: var(--dim); font-size: 12.5px; line-height: 1.7; }
  a { color: var(--accent); }
  .err { color: var(--bad); }
  @media (max-width: 640px) {
    .wrap { padding: 24px 16px 56px; }
    .comp { grid-template-columns: 1fr; gap: 2px; }
    .comp .cd { margin-bottom: 6px; }
    .note { margin-left: 0; width: 100%; }
  }
</style>
</head>

<div class="wrap">
  <header>
    <div class="top">
      <h1>yourprompt</h1>

    <p class="why" id="why" hidden></p>
  </div>

  <div class="axes" id="axes"></div>

  <footer id="foot"></footer>
</div>

function escapeHtml(s) {

// --- the WebAssembly boundary ---------------------------------------------
// Strings cross as (pointer, length) and come back length-prefixed. Every
// buffer we take ownership of is handed straight back.

function write(bytes) {
  if (!bytes.length) return [0, 0];
  const ptr = wasm.yp_alloc(bytes.length);
  new Uint8Array(wasm.memory.buffer, ptr, bytes.length).set(bytes);
  return [ptr, bytes.length];
}

function readAndFree(ptr) {
  if (!ptr) return null;
  const view = new DataView(wasm.memory.buffer);
  const len = view.getUint32(ptr, true);
  const text = dec.decode(new Uint8Array(wasm.memory.buffer, ptr + 4, len));
  wasm.yp_free(ptr, 4 + len);
  return text;
}

function scoreNow(instruction) {
  const buffers = [];
  try {
    const [tp, tl] = write(enc.encode(instruction)); buffers.push([tp, tl]);
    const [ap, al] = write(new Uint8Array());        buffers.push([ap, al]);
    const [ip, il] = write(indexBytes || new Uint8Array()); buffers.push([ip, il]);
    const out = wasm.yp_score_parts(tp, tl, ap, al, ip, il);
    const json = readAndFree(out);
    return json ? JSON.parse(json) : null;
  } finally {
    for (const [ptr, len] of buffers) if (ptr) wasm.yp_free(ptr, len);
  }
}

/// Index the visitor's files, in their browser. The files *are* the
/// repository, so the grounding axis is about their code and not about
/// whichever project happened to ship with the page.
function rebuildIndex() {
  // Files that arrive before the scorer has loaded are indexed at boot.
  if (!files.length || !wasm) { indexBytes = null; return; }
  const payload = files.map(f => f.name + '\u001f' + f.text).join('\u001e');
  const bytes = enc.encode(payload);
  const [p, l] = write(bytes);
  try {
    const out = wasm.yp_index_build(p, l);
    if (!out) { indexBytes = null; return; }
    const view = new DataView(wasm.memory.buffer);
    const len = view.getUint32(out, true);
    indexBytes = new Uint8Array(
      new Uint8Array(wasm.memory.buffer, out + 4, len));  // copy before freeing
    wasm.yp_free(out, 4 + len);
  } finally {
    if (p) wasm.yp_free(p, l);
  }
}

function renderAxis(axis, absent) {
  if (absent) {
    return `<div class="axis"><div class="head"><span class="name">${axisName('grounding')}</span>
      <span class="num">${T().not_scored}</span></div>
      <div class="muted">${T().no_index}</div></div>`;
  }
  const r = axis.max ? axis.earned / axis.max : 0;
  const comps = axis.components.map(c => `
    <div class="comp">
      <span class="cn">${compName(c.id)}</span>
      <span class="cv">${c.earned.toFixed(1)} / ${c.max.toFixed(0)}</span>
      <span class="cd">${escapeHtml(c.detail)}</span>
    </div>`).join('');
  return `<div class="axis">
    <div class="head">
      <span class="name">${axisName(axis.id)}</span>
      <span class="num">${axis.earned.toFixed(1)} / ${axis.max.toFixed(0)}</span>
    </div>
    <div class="track" style="margin-bottom:8px">
      <div class="fill" style="width:${(r*100).toFixed(1)}%;background:${colourFor(r)}"></div>
    </div>
    ${comps}</div>`;
}

// What the page says instead of a number when the prompt is not a task: a
// slash command, a follow-up that leans on the conversation, or a language
// the lexicons do not cover. Null for a task, and for a scorer too old to
// report a kind, which is graded as it always was.
function ungradedNote(s) {
  const say = s.kind && T().ungraded[s.kind];
  if (!say) return null;
  const names = T().languages || {};
  return say(s.language && (names[s.language] || s.language));
}

const sampleButton = () =>
  `<button type="button" data-act="sample">${T().load_sample}</button>`;

// Without an index the grounding axis is skipped and the other three are
// scaled up to 1000, so an invented file name scores exactly what a real one
// does: both of the long examples score 740.5. A dim "ungrounded, rescaled"
// at the far end of the row did not get that across, so the badge sits
// against the grade and says what to do about it. The offer of the sample
// repository moves here from the empty file list, so it is made once.
function renderStatus(s, ungraded) {
  const badge = $('badge'), why = $('why');
  const offer = !!s && !ungraded && s.renormalized && !files.length;
  badge.hidden = why.hidden = true;
  $('atts').classList.toggle('offered-below', offer);
  if (!s) return;
  if (ungraded) {
    why.className = 'why ungraded';
    why.textContent = ungraded;
    why.hidden = false;
    return;
  }
  badge.className = s.renormalized ? 'badge warn' : 'badge good';
  badge.textContent = s.renormalized ? T().unchecked : T().indexed(files.length);
  badge.hidden = false;
  if (offer) {
    why.className = 'why';
    why.innerHTML = '<span>' + escapeHtml(T().unchecked_why) + '</span>' + sampleButton();
    why.hidden = false;
  }
}

function render(s) {
  const ungraded = ungradedNote(s);
  const r = ungraded ? 0 : s.total / 1000;
  $('total').textContent = ungraded ? '—' : s.total.toFixed(1);
  $('of').hidden = !!ungraded;
  $('grade').textContent = ungraded ? '' : s.grade;
  $('grade').style.color = colourFor(r);
  $('fill').style.width = (r * 100).toFixed(1) + '%';
  $('fill').style.background = colourFor(r);
  renderStatus(s, ungraded);
  if (ungraded) {
    $('axes').innerHTML = '';
    clearMarks();
    return;
  }
  $('axes').innerHTML =
    renderAxis(s.grounding, !s.grounding) +
    renderAxis(s.actionability) + renderAxis(s.clarity) + renderAxis(s.context);
  paintMarks($('p').value, s.marks || []);
}

// --- marks -----------------------------------------------------------------
// The engine reports byte ranges of the prompt; JavaScript strings are UTF-16.
// Map each UTF-8 byte offset to the string index it starts at.
function byteToCharMap(text) {
  const map = [];
  let b = 0;
  for (let i = 0; i < text.length; i++) {
    const c = text.codePointAt(i);
    map[b] = i;
    b += c < 0x80 ? 1 : c < 0x800 ? 2 : c < 0x10000 ? 3 : 4;
    if (c > 0xffff) i++;
  }
  map[b] = text.length;
  return map;
}

function markLabel(m) {
  const k = T().marks.kinds[m.kind];
  if (typeof k === 'function') return k(m.count);
  return k || m.note;
}

function paintMarks(text, marks) {
  const map = byteToCharMap(text);
  let html = '', at = 0;
  const chips = [], seen = new Set();
  for (const m of marks) {
    const s = map[m.start], e = map[m.end];
    if (s == null || e == null || s < at || e <= s) continue;
    const term = text.slice(s, e);
    html += escapeHtml(text.slice(at, s)) +
      '<mark class="' + m.tone + '">' + escapeHtml(term) + '</mark>';
    at = e;
    const key = m.kind + '|' + term.toLowerCase();
    if (m.kind === 'attachment' || seen.has(key)) continue;
    seen.add(key);
    chips.push('<span class="chip ' + m.tone + '"><b>' +
      escapeHtml(term.length > 28 ? term.slice(0, 27) + '…' : term) + '</b> · ' +
      escapeHtml(markLabel(m)) + '</span>');
  }
  html += escapeHtml(text.slice(at)) + '\n';
  $('hl').innerHTML = html;
  syncMarks();
  const L = T().marks.legend;
  $('legend').innerHTML = marks.length ? ['good', 'warn', 'bad'].map(t =>
    '<span><i style="background:var(--m-' + t + ')"></i>' + escapeHtml(L[t]) + '</span>'
  ).join('') : '';
  $('chips').innerHTML = chips.slice(0, 30).join('');
}

function clearMarks() {
  $('hl').innerHTML = ''; $('legend').innerHTML = ''; $('chips').innerHTML = '';
}

// Keep the painted layer under the same text: same scroll position, and the
// same wrapping width once the textarea grows a scrollbar.
function syncMarks() {
  const ta = $('p'), hl = $('hl');
  hl.scrollTop = ta.scrollTop;
  const bar = Math.max(0, (ta.offsetWidth || 0) - (ta.clientWidth || 0) - 2);
  hl.style.paddingRight = (12 + bar) + 'px';
}
$('p').addEventListener('scroll', syncMarks);

function clearScore() {
  lastScore = null;
  $('download').disabled = true;
  $('share').disabled = true;
  $('total').textContent = '--'; $('of').hidden = false; $('grade').textContent = '';
  $('fill').style.width = '0';
  renderStatus(null);
  $('axes').innerHTML = '';
  clearMarks();
}

const kb = list => (list.reduce((n, f) => n + f.text.length, 0) / 1024).toFixed(1);

// The sample repository is listed as one row, because it is loaded and
// removed as a whole.
function renderFiles() {
  if (!files.length) {
    $('atts').innerHTML = '<div class="empty-att">' + T().empty + ' ' + sampleButton() + '</div>';
    return;
  }
  const sample = files.filter(f => f.sample);
  const rows = sample.length ? [`
    <div class="att sample">
      <span>${T().sample}</span>
      <span class="sz">${kb(sample)} KB</span>
      <button type="button" data-sample="1">${T().remove}</button>
      <span class="nm">${sample.map(f => escapeHtml(f.name)).join(' · ')}</span>
    </div>`] : [];
  files.forEach((a, i) => {
    if (a.sample) return;
    rows.push(`
    <div class="att">
      <span class="nm">${escapeHtml(a.name)}</span>
      <span class="sz">${kb([a])} KB</span>
      <button type="button" data-i="${i}">${T().remove}</button>
    </div>`);
  });
  $('atts').innerHTML = rows.join('');
  $('atts').querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => {
      if (b.dataset.sample) files = files.filter(f => !f.sample);
      else files.splice(Number(b.dataset.i), 1);
      filesChanged();
    }));
}

function filesChanged() {
  renderFiles();
  rebuildIndex();
  score();
}

let timer = null;
function score() {
  if (!wasm) return;
  const text = $('p').value;
  if (!text.trim()) { clearScore(); return; }
  try {
    const s = scoreNow(text);
    if (!s) throw new Error(T().unreadable);
    lastScore = s;
    $('download').disabled = false;
    $('share').disabled = false;
    render(s);
  } catch (e) {
    clearScore();
    $('axes').innerHTML = '<div class="axis err">' + escapeHtml(e.message) + '</div>';
  }
}

// The prompt travels in the fragment, which browsers never send to a server.
function encodePrompt(text) {
  let bin = '';
  for (const byte of enc.encode(text)) bin += String.fromCharCode(byte);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decodePrompt(code) {
  const bin = atob(code.replace(/-/g, '+').replace(/_/g, '/'));
  return dec.decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

// Whether the sample repository was loaded travels too, so a shared link
// reproduces the grounded score it was shared with. The visitor's own files
// cannot travel; a link made with them scores as if they were absent.
$('share').addEventListener('click', async () => {
  const text = $('p').value;
  if (!text.trim()) return;
  const sample = files.some(f => f.sample);
  const url = location.origin + location.pathname + '#p=' + encodePrompt(text) +
    (sample ? '&repo=sample' : '');
  history.replaceState(null, '', url);
  try {
    await navigator.clipboard.writeText(url);
    note(sample ? T().copied_sample : T().copied);
  } catch (e) {
    note(T().copy_failed, true);
  }
});

function fromHash() {
  const shared = { prompt: null, sample: false };
  for (const part of location.hash.slice(1).split('&')) {
    const [key, value] = part.split('=');
    if (key === 'p' && /^[A-Za-z0-9_-]+$/.test(value || '')) {
      try { shared.prompt = decodePrompt(value); } catch (e) { /* a mangled link */ }
    } else if (key === 'repo' && value === 'sample') {
      shared.sample = true;
    }
  }
  return shared;
}

  .then(r => r.ok ? r.json() : null)
  .then(repo => {
    const n = repo && repo.stargazers_count;

  })

// --- the sample repository --------------------------------------------------
// Grounding is 350 of the 1000 points, and a visitor with no code at hand
// never sees it: with nothing indexed, the prompt about src/banana.rs scores
// 740.5, the same as the one about src/auth/login.rs, because neither name
// was checked. Against these six files the login prompt rises to 851.8 and
// the invented one falls to 563.8. They are indexed exactly like dropped
// files.
//
// No English prose, on purpose. In a corpus this small a README makes "the"
// a name found in one file, and "fix the bug" scored 428.5 against it
// instead of 278.5.

const SAMPLE = [
  ['Cargo.toml', `[package]
name = "acme-auth"
version = "0.3.1"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
`],
  ['src/auth/login.rs', `use crate::auth::token::Token;

#[derive(Debug, PartialEq)]
pub enum AuthError {
    Expired,
    Invalid,
    Missing,
}

pub struct Claims {
    pub sub: String,
    pub exp: u64,
}

pub fn verify_token(t: &Token) -> Result<Claims, AuthError> {
    let claims = t.decode().map_err(|_| AuthError::Invalid)?;
    if claims.exp < now() {
        panic!("token expired");
    }
    Ok(claims)
}

pub fn login(user: &str, password: &str) -> Result<Token, AuthError> {
    if password.is_empty() {
        return Err(AuthError::Missing);
    }
    let token = Token::issue(user);
    verify_token(&token)?;
    Ok(token)
}

fn now() -> u64 {
    std::time::SystemTime::now()
        .duration_since(std::time::UNIX_EPOCH)
        .map(|d| d.as_secs())
        .unwrap_or(0)
}
`],
  ['src/auth/token.rs', `use crate::auth::login::Claims;
use crate::session::SESSION_TIMEOUT_SECS;

pub struct Token(String);

impl Token {
    pub fn issue(user: &str) -> Token {
        Token(format!("{user}:{SESSION_TIMEOUT_SECS}"))
    }

    pub fn decode(&self) -> Result<Claims, ()> {
        let (sub, exp) = self.0.split_once(':').ok_or(())?;
        let exp = exp.parse().map_err(|_| ())?;
        Ok(Claims { sub: sub.to_string(), exp })
    }
}
`],
  ['src/session.rs', `use crate::auth::login::{verify_token, AuthError};
use crate::auth::token::Token;

pub const SESSION_TIMEOUT_SECS: u64 = 300;

pub struct Session {
    pub user: String,
    pub expires_at: u64,
}

pub fn start_session(token: &Token) -> Result<Session, AuthError> {
    let claims = verify_token(token)?;
    Ok(Session { user: claims.sub, expires_at: claims.exp + SESSION_TIMEOUT_SECS })
}

pub fn refresh_token(session: &Session) -> Token {
    Token::issue(&session.user)
}
`],
  ['src/routes.rs', `use crate::auth::login::{login, AuthError};

pub struct Request {
    pub user: String,
    pub password: String,
}

pub struct Response {
    pub status: u16,
    pub body: String,
}

pub fn post_login(req: &Request) -> Response {
    match login(&req.user, &req.password) {
        Ok(_) => Response { status: 200, body: "ok".into() },
        Err(AuthError::Missing) => Response { status: 400, body: "password required".into() },
        Err(_) => Response { status: 401, body: "unauthorized".into() },
    }
}

function loadSample() {
  const added = addTexts(SAMPLE.map(([name, text]) => ({ name, text, sample: true })));
  if (added.length) note(T().sample_added(SAMPLE.length));
}

document.addEventListener('click', e => {
  if (e.target.closest && e.target.closest('[data-act="sample"]')) loadSample();
});

// --- attaching files -------------------------------------------------------

function looksBinary(text) {
  // A NUL byte never appears in text a human wrote.
  if (text.indexOf('\u0000') !== -1) return true;
  // Repeated U+FFFD means the bytes were decoded as UTF-8 but were not.
  const replacements = (text.match(/\uFFFD/g) || []).length;
  return replacements > 3 && replacements / Math.max(text.length, 1) > 0.001;
}

// Everything bound for the index comes through here: the files a visitor
// drops or picks, and the sample repository. A file already present with the
// same name and contents is not added again, because a second copy makes
// every name defined in it look defined twice: loading the sample twice took
// the showcase prompt from 851.8 to 784.3.
function addTexts(entries) {
  const fresh = entries.filter(e =>
    !files.some(f => f.name === e.name && f.text === e.text));
  if (fresh.length) {
    files.push(...fresh);
    filesChanged();
  }
  return fresh;
}

// Any file can be picked, so anything that is not text, or is larger than
// MAX_BYTES, is turned away here with the reason.
function readFile(file) {
  return new Promise(resolve => {
    const refuse = problem => resolve({ name: file.name, problem });
    if (file.size > MAX_BYTES) {
      refuse(T().too_big(file.name, (file.size / 1024).toFixed(0)));
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => refuse(T().read_failed(file.name));
    reader.onload = () => {
      const text = String(reader.result);
      if (looksBinary(text)) refuse(T().not_text(file.name));
      else resolve({ name: file.name, text });
    };
    reader.readAsText(file, 'utf-8');
  });
}

// Files that arrive together are read first and indexed once. Re-indexing as
// each one finished spent 15.7 s on 300 files that index in 0.1 s together.
async function addFiles(list) {
  if (!list.length) return;
  const read = await Promise.all(list.map(readFile));
  const added = addTexts(read.filter(r => !r.problem));
  const refused = read.filter(r => r.problem);
  const said = [];
  if (added.length) {
    said.push(added.length === 1 ? T().added(added[0].name) : T().added_many(added.length));
  }
  if (refused.length) {
    said.push(refused.length === 1 ? refused[0].problem : T().skipped_many(refused.length));
  }
  note(said.join('; '), refused.length > 0 && !added.length);
}

$('open').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => {
  const picked = Array.from(e.target.files);
  e.target.value = '';
  addFiles(picked);
});

for (const target of [$('p'), $('atts')]) {
  ['dragenter', 'dragover'].forEach(k =>
    target.addEventListener(k, e => { e.preventDefault(); target.classList.add('dropping'); }));
  ['dragleave', 'drop'].forEach(k =>
    target.addEventListener(k, () => target.classList.remove('dropping')));
  target.addEventListener('drop', e => {
    e.preventDefault();
    addFiles(Array.from(e.dataTransfer.files || []));
  });
}

$('clear').addEventListener('click', () => {
  $('p').value = ''; files = []; note('');
  if (location.hash) history.replaceState(null, '', location.pathname);
  renderFiles(); rebuildIndex(); clearScore(); renderTry(); $('p').focus();
});

// --- the report ------------------------------------------------------------

function axisSection(axis, id) {
  if (!axis) {
    return `### ${axisName('grounding')}: ${T().not_scored}\n\n${T().rpt.no_index}\n`;
  }
  const rows = axis.components.map(c =>
    `| ${compName(c.id)} | ${c.earned.toFixed(1)} | ${c.max.toFixed(0)} | ${c.detail.replace(/\|/g, '\\|')} |`
  ).join('\n');
  return `### ${axisName(id)}: ${axis.earned.toFixed(1)} / ${axis.max.toFixed(0)}\n\n` +
    `${T().rpt.head}\n|---|---:|---:|---|\n${rows}\n`;
}

function buildReport(s, prompt) {
  const longest = (prompt.match(/`+/g) || []).reduce((n, run) => Math.max(n, run.length), 0);
  const fence = '`'.repeat(Math.max(3, longest + 1));
  const listed = files.length
    ? files.map(a => `- ${a.name} (${kb([a])} KB)`).join('\n')
    : T().rpt.none;
  const ungraded = ungradedNote(s);
  const breakdown = ungraded ? [] : [
    `## ${T().rpt.breakdown}`, ``,
    axisSection(s.grounding, 'grounding'),
    axisSection(s.actionability, 'actionability'),
    axisSection(s.clarity, 'clarity'),
    axisSection(s.context, 'context'),
  ];
  return [
    `# yourprompt`, ``,
    ungraded ? `**—** ${ungraded}` : `**${s.total.toFixed(1)} / 1000 (${s.grade})**`, ``,
    `| | |`, `|---|---|`,
    `| ${T().rpt.generated} | ${new Date().toISOString()} |`,
    `| ${T().rpt.grounded} | ${s.renormalized ? T().rpt.no : T().rpt.yes} |`,
    ``, `## ${T().rpt.prompt}`, ``, fence, prompt, fence,
    ``, `## ${T().rpt.codebase}`, ``, listed, ``,
    ...breakdown,
    `---`, ``,
    T().rpt.foot, ``,
  ].join('\n');
}

$('download').addEventListener('click', () => {
  if (!lastScore) return;
  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 16);
  const label = ungradedNote(lastScore) ? lastScore.kind : lastScore.total.toFixed(0);
  const name = `yourprompt-${label}-${stamp}.md`;
  const blob = new Blob([buildReport(lastScore, $('p').value)],
                        {type: 'text/markdown;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = name;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  note(T().saved(name));
});

// --- boot ------------------------------------------------------------------

let wasmVersion = '';
applyLang();
(async () => {
  try {
    const { instance } = await WebAssembly.instantiateStreaming(fetch('yp.wasm'), {});
    wasm = instance.exports;
  } catch (e) {
    // instantiateStreaming needs the right MIME type; fall back if the host
    // serves .wasm as something else.
    try {
      const bytes = await (await fetch('yp.wasm')).arrayBuffer();
      wasm = (await WebAssembly.instantiate(bytes, {})).instance.exports;
    } catch (e2) {
      $('sub').innerHTML = '<span class="err">' + T().load_failed
        + escapeHtml(e2.message) + '</span>';
      return;
    }
  }
  wasmVersion = readAndFree(wasm.yp_version());
  $('sub').textContent = T().ready(wasmVersion);
  const shared = fromHash();
  if (shared.prompt) { $('p').value = shared.prompt; renderTry(); }
  if (shared.sample) loadSample();
  rebuildIndex();
  score();
})();
